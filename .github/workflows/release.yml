name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version (without a leading v)
        required: true
        type: string
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build ${{ matrix.rid }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        include:
          - { rid: win-x64, server: '' }
          - { rid: win-arm64, server: '' }
          - { rid: osx-x64, server: '' }
          - { rid: osx-arm64, server: '' }
          - { rid: linux-x64, server: linux-x64 }
          - { rid: linux-arm64, server: linux-arm64 }
          - { rid: linux-musl-x64, server: linux-musl-x64 }
          - { rid: linux-musl-arm64, server: linux-musl-arm64 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/HyPanel.Web/package-lock.json
      - name: Install web dependencies
        working-directory: web/HyPanel.Web
        run: npm ci
      - name: Resolve release version
        id: release-version
        env:
          INPUT_VERSION: ${{ inputs.version }}
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$REF_TYPE" == "tag" ]]; then
            version="${REF_NAME#v}"
          else
            version="$INPUT_VERSION"
          fi
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release version: $version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Build release artifacts
        shell: sh
        env:
          AGENT_RIDS: ${{ matrix.rid }}
          SERVER_RIDS: ${{ matrix.server }}
          RELEASE_VERSION: ${{ steps.release-version.outputs.version }}
        run: |
          SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
          export SOURCE_DATE_EPOCH
          REQUIRE_ALL_AGENT_RIDS=false sh scripts/build-release.sh "$RELEASE_VERSION" release-output
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.rid }}
          path: release-output
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: gathered
          merge-multiple: false
      - name: Assemble release metadata
        run: |
          mkdir assembled
          find gathered -type f \( -name '*.tar.gz' -o -name '*.zip' \) -exec cp '{}' assembled/ \;
          cp gathered/release-linux-x64/install.sh assembled/
          cp gathered/release-linux-x64/install.ps1 assembled/
          jq -s --argjson frozen '["win-x64","win-arm64","osx-x64","osx-arm64","linux-x64","linux-arm64","linux-musl-x64","linux-musl-arm64"]' 'def assets: (map(.assets) | add); {schemaVersion:1, version:.[0].version, publishedAt:.[0].publishedAt, assets:assets} | if ([.assets[].rid] | unique | sort) == ($frozen | sort) and (.assets | length) == 8 then . else error("manifest must contain exactly 8 frozen Agent RIDs") end' gathered/*/manifest.json > assembled/manifest.json
          (cd assembled && sha256sum -- * > SHA256SUMS)
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || format('v{0}', inputs.version) }}
          name: HyPanel ${{ inputs.version || github.ref_name }}
          files: assembled/*

  container-build:
    name: Build GHCR ${{ matrix.arch }}
    needs: build
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - { arch: amd64, platform: linux/amd64, runner: ubuntu-latest }
          - { arch: arm64, platform: linux/arm64, runner: ubuntu-24.04-arm }
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Resolve image version
        id: image-version
        env:
          INPUT_VERSION: ${{ inputs.version }}
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$REF_TYPE" == "tag" ]]; then version="${REF_NAME#v}"; else version="$INPUT_VERSION"; fi
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release version: $version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/Dockerfile
          platforms: ${{ matrix.platform }}
          build-args: VERSION=${{ steps.image-version.outputs.version }}
          push: true
          tags: ghcr.io/greepar/hypanel:${{ steps.image-version.outputs.version }}-${{ matrix.arch }}

  container:
    name: Publish GHCR manifest
    needs: container-build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish multi-architecture tags
        env:
          INPUT_VERSION: ${{ inputs.version }}
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
          COMMIT_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$REF_TYPE" == "tag" ]]; then version="${REF_NAME#v}"; else version="$INPUT_VERSION"; fi
          short_sha="${COMMIT_SHA:0:7}"
          source_amd64="ghcr.io/greepar/hypanel:$version-amd64"
          source_arm64="ghcr.io/greepar/hypanel:$version-arm64"
          for tag in "$version" latest "sha-$short_sha"; do
            docker buildx imagetools create -t "ghcr.io/greepar/hypanel:$tag" "$source_amd64" "$source_arm64"
          done
