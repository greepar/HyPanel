name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version (without a leading v)
        required: true
        type: string
      publish:
        description: Publish the GitHub release and container images (off = build-only dry run)
        required: false
        default: true
        type: boolean
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build ${{ matrix.rid }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: true
      matrix:
        include:
          # glibc: Microsoft's cross-build images link against an old-glibc sysroot, so the binaries run on
          # Debian 11 / Ubuntu 20.04 and newer.  The .NET SDK itself is installed into the container.
          - rid: linux-x64
            runner: ubuntu-latest
            image: mcr.microsoft.com/dotnet-buildtools/prereqs:azurelinux-3.0-net10.0-cross-amd64
            publish-args: -p:SysRoot=/crossrootfs/x64 -p:LinkerFlavor=lld
            server: linux-x64
          - rid: linux-arm64
            runner: ubuntu-latest
            image: mcr.microsoft.com/dotnet-buildtools/prereqs:azurelinux-3.0-net10.0-cross-arm64
            publish-args: -p:SysRoot=/crossrootfs/arm64 -p:LinkerFlavor=lld
            server: linux-arm64
          # musl: the official Alpine NativeAOT SDK image, built natively on each architecture.
          - rid: linux-musl-x64
            runner: ubuntu-latest
            image: mcr.microsoft.com/dotnet/sdk:10.0-alpine-aot
            server: linux-musl-x64
          - rid: linux-musl-arm64
            runner: ubuntu-24.04-arm
            image: mcr.microsoft.com/dotnet/sdk:10.0-alpine-aot
            server: linux-musl-arm64
          - { rid: win-x64, runner: windows-latest }
          - { rid: win-arm64, runner: windows-latest }
          - { rid: osx-x64, runner: macos-26-intel }
          - { rid: osx-arm64, runner: macos-26 }
    steps:
      - uses: actions/checkout@v4
      - name: Resolve release version
        id: release-version
        env:
          INPUT_VERSION: ${{ inputs.version }}
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$REF_TYPE" == "tag" ]]; then
            version="${REF_NAME#v}"
          else
            version="$INPUT_VERSION"
          fi
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release version: $version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "source-date-epoch=$(git log -1 --format=%ct)" >> "$GITHUB_OUTPUT"
      # The Server embeds the web UI; build it on the runner so the toolchain containers need no Node.js.
      - uses: actions/setup-node@v4
        if: matrix.server != ''
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/HyPanel.Web/package-lock.json
      - name: Build web UI
        if: matrix.server != ''
        working-directory: web/HyPanel.Web
        run: npm ci && npm run build
      - uses: actions/setup-dotnet@v4
        if: matrix.image == ''
        with:
          dotnet-version: 10.0.x
      - name: Build release artifacts
        if: matrix.image == ''
        shell: bash
        env:
          AGENT_RIDS: ${{ matrix.rid }}
          SERVER_RIDS: ''
          RELEASE_VERSION: ${{ steps.release-version.outputs.version }}
          SOURCE_DATE_EPOCH: ${{ steps.release-version.outputs.source-date-epoch }}
          PYTHON: ${{ runner.os == 'Windows' && 'python' || 'python3' }}
          REQUIRE_ALL_AGENT_RIDS: 'false'
        run: sh scripts/build-release.sh "$RELEASE_VERSION" release-output
      - name: Build release artifacts in ${{ matrix.image }}
        if: matrix.image != ''
        shell: bash
        env:
          IMAGE: ${{ matrix.image }}
          AGENT_RIDS: ${{ matrix.rid }}
          SERVER_RIDS: ${{ matrix.server }}
          EXTRA_PUBLISH_ARGS: ${{ matrix.publish-args }} -p:SkipWebBuild=true
          RELEASE_VERSION: ${{ steps.release-version.outputs.version }}
          SOURCE_DATE_EPOCH: ${{ steps.release-version.outputs.source-date-epoch }}
        run: |
          docker run --rm -v "$PWD:/src" -w /src \
            -e AGENT_RIDS -e SERVER_RIDS -e EXTRA_PUBLISH_ARGS -e RELEASE_VERSION -e SOURCE_DATE_EPOCH \
            -e REQUIRE_ALL_AGENT_RIDS=false -e DOTNET_CLI_TELEMETRY_OPTOUT=1 -e DOTNET_NOLOGO=1 \
            "$IMAGE" sh -euc '
              if command -v apk >/dev/null 2>&1; then
                apk add --no-cache python3 >/dev/null
              fi
              if ! command -v dotnet >/dev/null 2>&1; then
                curl -fsSL https://dot.net/v1/dotnet-install.sh -o /tmp/dotnet-install.sh
                bash /tmp/dotnet-install.sh --channel 10.0 --install-dir /usr/share/dotnet >/dev/null
                export PATH="/usr/share/dotnet:$PATH"
              fi
              sh scripts/build-release.sh "$RELEASE_VERSION" release-output
            '
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.rid }}
          path: release-output
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build
    if: github.event_name == 'push' || inputs.publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: gathered
          merge-multiple: false
      - name: Assemble release metadata
        run: |
          mkdir assembled
          find gathered -type f \( -name '*.tar.gz' -o -name '*.zip' \) -exec cp '{}' assembled/ \;
          cp gathered/release-linux-x64/install.sh assembled/
          cp gathered/release-linux-x64/install.ps1 assembled/
          jq -s --argjson frozen '["win-x64","win-arm64","osx-x64","osx-arm64","linux-x64","linux-arm64","linux-musl-x64","linux-musl-arm64"]' 'def assets: (map(.assets) | add); {schemaVersion:1, version:.[0].version, publishedAt:.[0].publishedAt, assets:assets} | if ([.assets[].rid] | unique | sort) == ($frozen | sort) and (.assets | length) == 8 then . else error("manifest must contain exactly 8 frozen Agent RIDs") end' gathered/*/manifest.json > assembled/manifest.json
          (cd assembled && sha256sum -- * > SHA256SUMS)
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || format('v{0}', inputs.version) }}
          name: HyPanel ${{ inputs.version || github.ref_name }}
          files: assembled/*

  container-build:
    name: Build GHCR ${{ matrix.arch }}
    needs: build
    if: github.event_name == 'push' || inputs.publish
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - { arch: amd64, platform: linux/amd64, runner: ubuntu-latest }
          - { arch: arm64, platform: linux/arm64, runner: ubuntu-24.04-arm }
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Resolve image version
        id: image-version
        env:
          INPUT_VERSION: ${{ inputs.version }}
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$REF_TYPE" == "tag" ]]; then version="${REF_NAME#v}"; else version="$INPUT_VERSION"; fi
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release version: $version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/Dockerfile
          platforms: ${{ matrix.platform }}
          build-args: VERSION=${{ steps.image-version.outputs.version }}
          push: true
          tags: ghcr.io/greepar/hypanel:${{ steps.image-version.outputs.version }}-${{ matrix.arch }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/Dockerfile.agent
          platforms: ${{ matrix.platform }}
          push: true
          tags: ghcr.io/greepar/hypanel-agent:${{ steps.image-version.outputs.version }}-${{ matrix.arch }}

  container:
    name: Publish GHCR manifest
    needs: container-build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish multi-architecture tags
        env:
          INPUT_VERSION: ${{ inputs.version }}
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
          COMMIT_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$REF_TYPE" == "tag" ]]; then version="${REF_NAME#v}"; else version="$INPUT_VERSION"; fi
          short_sha="${COMMIT_SHA:0:7}"
          for image in hypanel hypanel-agent; do
            source_amd64="ghcr.io/greepar/$image:$version-amd64"
            source_arm64="ghcr.io/greepar/$image:$version-arm64"
            for tag in "$version" latest "sha-$short_sha"; do
              docker buildx imagetools create -t "ghcr.io/greepar/$image:$tag" "$source_amd64" "$source_arm64"
            done
          done
